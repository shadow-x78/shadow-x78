name: Metrics
on:
  schedule: [{cron: "0 * * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: shadow-x78
          template: classic
          base: header, repositories
          config_timezone: Asia/Riyadh
          config_theme: dark
          extras_css: |
            svg { background-color: #0a0a0a !important; border-radius: 10px !important; }
            h1, h2, h3, .field { color: #CC0000 !important; }
            * { color: #666666 !important; }
